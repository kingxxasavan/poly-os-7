# picom (compositor) settings for PolyOS: blur behind the shell, soft shadows,
# rounded corners and fades. polyos-session retries with the xrender backend when
# OpenGL is unavailable (virtual machines). Override with ~/.config/polyos/picom.conf.

backend = "glx";
vsync = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# Fades
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

# Shadows (not on the shell itself: its surfaces draw their own edges)
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.38;
shadow-offset-x = -18;
shadow-offset-y = -12;
shadow-exclude = [
  "class_g = 'PolyOS'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@",
  "_NET_WM_STATE@[0]:32a = '_NET_WM_STATE_FULLSCREEN'"
];

# Rounded corners: 12px for apps; PolyOS's own dock and menus are rounder, as in PolyOS 7
corner-radius = 12;
corner-radius-rules = [
  "26:class_g = 'PolyOS' && window_type = 'dock'",
  "22:class_g = 'PolyOS' && window_type = 'utility'"
];
rounded-corners-exclude = [
  "window_type = 'dock' && !class_g = 'PolyOS'",
  "window_type = 'desktop'",
  "_NET_WM_STATE@[0]:32a = '_NET_WM_STATE_FULLSCREEN'"
];

# Frosted glass behind the taskbar and popups only
blur-method = "dual_kawase";
blur-strength = 6;
blur-background = true;
blur-background-exclude = [
  "!class_g = 'PolyOS'",
  "window_type = 'desktop'"
];

wintypes:
{
  tooltip = { fade = true; shadow = false; full-shadow = false; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1; };
  dropdown_menu = { opacity = 1; };
};
