# PolyOS touchpad defaults, like Windows: tap to click, tap with two fingers to right-click,
# natural scrolling, and no stray taps while typing. Applies to libinput touchpads only.
Section "InputClass"
    Identifier "PolyOS touchpad"
    MatchIsTouchpad "on"
    MatchDriver "libinput"
    Option "Tapping" "on"
    Option "TappingButtonMap" "lrm"
    Option "TappingDrag" "on"
    Option "NaturalScrolling" "true"
    Option "DisableWhileTyping" "on"
EndSection
