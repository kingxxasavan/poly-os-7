# Builds the PolyOS live ISOs on GitHub's servers (Debian inside a privileged container):
# amd64 for Intel/AMD PCs and arm64 for ARM64 UEFI computers, each on a runner of its own kind.
#
# Releases are automatic: raise __version__ in polyos/__init__.py on main and this builds both ISOs
# and publishes them as release v<version>; the website's Download buttons offer the newest release
# right away. A version that is already released isn't built again.
#
# By hand: the Actions tab ("Run workflow") makes a test build with 14-day downloads on the run, or,
# with "Publish as a GitHub Release" ticked, publishes the current version. Pushing a tag like
# v0.7.0 also publishes a release.
name: Build PolyOS ISO

on:
  workflow_dispatch:
    inputs:
      dist:
        description: Debian release
        type: choice
        options: [trixie, bookworm]
        default: trixie
      release:
        description: Publish as a GitHub Release (the website's Download buttons offer it)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [polyos/__init__.py]  # the version number lives here
    tags: ["v*"]

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # publishing releases

env:
  DIST: ${{ inputs.dist || 'trixie' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.kind.outputs.build }}
      publish: ${{ steps.kind.outputs.publish }}
      tag: ${{ steps.kind.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Checks and tests
        run: python3 main.py check && python3 main.py test

      - name: Release or test build?
        id: kind
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          version="v$(python3 -c 'import polyos; print(polyos.__version__)')"
          build=true publish=false tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            publish=true tag="$GITHUB_REF_NAME"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # polyos/__init__.py changed on main: a new version is released, the same one isn't rebuilt
            if git ls-remote --exit-code --tags origin "refs/tags/$version" > /dev/null; then
              echo "::notice::$version is already released; nothing to build."
              build=false
            else
              found=$?
              [ "$found" -eq 2 ] || exit "$found"  # 2: no such tag; anything else is a real error
              publish=true tag="$version"
            fi
          elif [ "$RELEASE_INPUT" = "true" ]; then
            publish=true tag="$version"
          fi
          { echo "build=$build"; echo "publish=$publish"; echo "tag=$tag"; } >> "$GITHUB_OUTPUT"
          echo "version $version: build=$build publish=$publish tag=$tag"

  iso:
    needs: setup
    if: ${{ needs.setup.outputs.build == 'true' }}
    strategy:
      fail-fast: false  # one architecture failing still publishes the other
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            grub: grub-efi-amd64-bin grub-pc-bin
          - arch: arm64
            runner: ubuntu-24.04-arm
            grub: grub-efi-arm64-bin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the ${{ matrix.arch }} ISO in Debian ${{ env.DIST }}
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src "debian:$DIST" bash -euxc "
            apt-get update
            apt-get install -y --no-install-recommends live-build debootstrap python3 ca-certificates \
              xorriso squashfs-tools ${{ matrix.grub }} mtools dosfstools
            python3 main.py iso --dist $DIST --arch ${{ matrix.arch }} --workdir /tmp/polyos-iso
          "
          sudo chown -R "$(id -u):$(id -g)" dist
          ls -lh dist/

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: polyos-${{ env.DIST }}-${{ matrix.arch }}-iso
          path: dist/*.iso
          compression-level: 0
          retention-days: ${{ needs.setup.outputs.publish == 'true' && 1 || 14 }}

  release:
    needs: [setup, iso]
    if: ${{ !cancelled() && needs.setup.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get the ISOs
        uses: actions/download-artifact@v4
        with:
          pattern: polyos-*-iso
          merge-multiple: true
          path: dist

      # Online updates: PolyOS's own packages and polyos-update.json (their checksums), which
      # Settings > About on installed computers reads to update without a new ISO.
      - name: PolyOS packages for online updates
        run: python3 main.py deb --out dist --manifest

      - name: Checksums (and parts, if an ISO is over GitHub's 2 GB per-file limit)
        run: |
          cd dist
          ls *.iso >/dev/null  # stop if no ISO was built at all
          # fixed names, so the website's /download/pc and /download/arm64 always get the newest release
          for arch in amd64 arm64; do
            for f in polyos-*-"$arch".iso; do if [ -e "$f" ]; then mv "$f" "polyos-$arch.iso"; fi; done
          done
          sha256sum ./*.iso | sed 's#\./##' > SHA256SUMS
          for iso in *.iso; do
            if [ "$(stat -c %s "$iso")" -gt 2000000000 ]; then
              split -b 1900M -d -a 1 "$iso" "$iso.part"
              sha256sum "$iso".part* >> SHA256SUMS
              rm "$iso"
              echo "PARTS=yes" >> "$GITHUB_ENV"
            fi
          done
          ls -lh

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PolyOS ${{ needs.setup.outputs.tag }}
          files: |
            dist/*.iso
            dist/*.iso.part*
            dist/SHA256SUMS
            dist/*.deb
            dist/polyos-update.json
          body: |
            **PolyOS 7 for Debian ${{ needs.setup.outputs.tag }}** (Debian ${{ env.DIST }})

            | File | For |
            |---|---|
            | `polyos-amd64.iso` | Intel and AMD PCs and laptops (almost every Windows PC) |
            | `polyos-arm64.iso` | ARM64: Apple Silicon Macs in UTM, Parallels or VMware Fusion, ARM cloud servers, and ARM64 computers with UEFI firmware (from a USB drive) |

            1. Download the `.iso` for your computer${{ env.PARTS && ' (in parts: join them with `cat polyos-*.part* > polyos.iso` on Linux/macOS, or `copy /b part0+part1 polyos.iso` on Windows)' || '' }}.
            2. Write it to a USB drive (8 GB or more) with balenaEtcher, or Rufus in DD mode, or start it in a virtual machine.
            3. Start the computer from it, try PolyOS, and choose **Install PolyOS 7**.

            **Already on PolyOS?** Open Settings › About › *Check for updates* to install this version without a new USB drive.

            Check the download against `SHA256SUMS`.
          generate_release_notes: true
